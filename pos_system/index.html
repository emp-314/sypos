<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS System</title>
  <link rel="stylesheet" href="frontend/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .landing {
      text-align: center;
      color: white;
    }

    .landing h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .landing p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .landing-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .landing-btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary-landing {
      background: white;
      color: #667eea;
    }

    .btn-primary-landing:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary-landing {
      background: transparent;
      color: white;
      border: 2px solid white;
    }

    .btn-secondary-landing:hover {
      background: white;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="landing">
    <h1>🏪 POS System</h1>
    <p>Professional Point of Sale Management System</p>
    <div class="landing-buttons">
      <a href="frontend/pages/login.html" class="landing-btn btn-primary-landing">Login</a>
    </div>
  </div>
</body>
</html>
